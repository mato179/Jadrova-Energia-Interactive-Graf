<html lang="sk"><head><meta charset="utf-8">

<title>Jadrová energia vo svete – Treemap 2024</title>
<style>
:root{color-scheme:dark;--bg:#06080f;--fg:#eef2ff;--mut:#8791b0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}

header{padding:22px 28px 12px;display:flex;flex-wrap:wrap;gap:14px 32px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#7aa2ff;margin-bottom:6px}

.stat:hover{transform:perspective(500px) translateY(-4px) scale(1.06) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}

.chip{cursor:pointer;border:1px solid rgba(255,255,255,.45);background:linear-gradient(180deg,rgba(255,255,255,.26) 0,rgba(255,255,255,.03) 46%,rgba(255,255,255,0) 50%),linear-gradient(145deg,color-mix(in srgb,var(--c1) 16%,transparent),color-mix(in srgb,var(--c1) 4%,rgba(255,255,255,.02)));-webkit-backdrop-filter:blur(16px) saturate(2.2);backdrop-filter:blur(16px) saturate(2.2);box-shadow:0 10px 22px -4px rgba(0,0,0,.45),0 6px 18px -6px var(--c1),inset 0 2px 1px rgba(255,255,255,.9),inset 0 -4px 8px rgba(255,255,255,.28),inset 0 0 16px color-mix(in srgb,var(--c1) 50%,transparent),inset 0 0 0 1px rgba(255,255,255,.22),inset 2px 0 3px rgba(255,255,255,.3),inset -2px 0 3px rgba(255,255,255,.2);text-shadow:0 1px 3px rgba(0,0,0,.45);color:var(--fg);padding:9px 18px;border-radius:99px;font:600 12px inherit;display:flex;align-items:center;gap:8px;transition:.25s}
.chip{position:relative;overflow:hidden;isolation:isolate}
.chip::before{content:"";position:absolute;left:9%;right:9%;top:2px;height:46%;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,.06));pointer-events:none;z-index:-1}
.chip::after{content:"";position:absolute;left:14%;right:14%;bottom:1px;height:38%;border-radius:99px;background:radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.5),transparent 72%);pointer-events:none;z-index:-1}
.chip i{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,var(--c1) 55%,color-mix(in srgb,var(--c1) 60%,#000) 100%);box-shadow:0 0 12px var(--c1),inset -1px -1px 2px rgba(0,0,0,.35)}
.chip:hover{filter:brightness(1.18);transform:perspective(500px) translateY(-3px) scale(1.07) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.chip.on{background:linear-gradient(180deg,rgba(255,255,255,.55) 0,rgba(255,255,255,.12) 46%,rgba(255,255,255,0) 50%),linear-gradient(145deg,color-mix(in srgb,var(--c1) 46%,transparent),color-mix(in srgb,var(--c1) 20%,transparent));border-color:rgba(255,255,255,.85);box-shadow:0 12px 26px -4px rgba(0,0,0,.45),0 0 26px -2px var(--c1),inset 0 2px 1px rgba(255,255,255,.95),inset 0 -3px 5px rgba(255,255,255,.35)}
main{flex:1;position:relative;margin:0 22px;min-height:0}
#map{position:absolute;inset:0}
.tile{position:absolute;padding:4.5px;transform-origin:center;transition:transform .45s cubic-bezier(.34,1.56,.64,1),opacity .35s,filter .35s;animation:pop .8s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(var(--i)*30ms);cursor:pointer;will-change:transform}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(30px);filter:blur(8px)}}
.in{display:flex;flex-direction:column;position:relative;width:100%;height:100%;border-radius:15px;overflow:hidden;padding:10px 12px;background:linear-gradient(145deg,color-mix(in srgb,var(--c1) 90%,transparent),color-mix(in srgb,var(--c2) 76%,transparent));-webkit-backdrop-filter:blur(14px) saturate(2.4) brightness(1.1);backdrop-filter:blur(14px) saturate(2.4) brightness(1.1);border:1px solid rgba(255,255,255,.38);box-shadow:0 8px 24px rgba(0,0,0,.3),inset 1.5px 1.5px 2px rgba(255,255,255,.7),inset -1.5px -2px 3px rgba(255,255,255,.22),inset 0 0 16px rgba(255,255,255,.05);transition:box-shadow .35s,border-color .35s}
.in::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,30%) var(--my,0%),rgba(255,255,255,.38),transparent 55%);opacity:0;transition:opacity .3s}
.in::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
.tile:hover{transform:perspective(var(--p,700px)) scale(var(--s)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(calc(var(--p,700px)*.04));z-index:30}
.tile:hover .in{background:linear-gradient(145deg,color-mix(in srgb,var(--c1) 98%,transparent),color-mix(in srgb,var(--c2) 90%,transparent));box-shadow:0 22px 56px rgba(0,0,0,.5),0 0 44px -4px var(--c1),inset 2.5px 2.5px 3px rgba(255,255,255,.9),inset -2px -3px 4px rgba(255,255,255,.35),inset 0 0 26px rgba(255,255,255,.08);border-color:rgba(255,255,255,.65)}
.tile:hover .in::before{opacity:1}
.tile:hover .in::after{left:130%;transition:left .8s ease}
.tile.off{opacity:.12!important;filter:grayscale(1);pointer-events:none}
.tile.sel .in{border-color:#fff;box-shadow:0 0 0 2px #fff,0 0 40px var(--c1)}
.cc{font-weight:800;letter-spacing:.04em;text-shadow:0 2px 8px rgba(0,0,0,.4);position:relative}
.nm{font-size:12px;opacity:.9;position:relative;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw{position:absolute;left:12px;bottom:9px;font-weight:700;font-variant-numeric:tabular-nums;font-size:12px;opacity:.95}
#tip .cap{margin-top:10px;font-size:11px;letter-spacing:.03em}#tip .bar{height:10px;padding:0;margin-top:3px;border-radius:99px;background:rgba(255,255,255,.2);box-shadow:inset 0 1px 3px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.15)}#tip .bar i{border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));box-shadow:0 0 14px var(--c1),inset 0 1px 1px rgba(255,255,255,.75);animation:grow .7s cubic-bezier(.22,1,.36,1)}@keyframes grow{from{width:0}}
.tw.f{position:static;left:auto;bottom:auto;margin-top:2px;white-space:nowrap;line-height:1.25}.cc{max-width:100%;white-space:nowrap}.det{display:flex;gap:18px;margin-top:10px;position:relative}.det b{display:block;font-size:17px;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px rgba(0,0,0,.35)}.det span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
#tip{position:fixed;z-index:99;pointer-events:none;padding:12px 15px;border-radius:14px;background:linear-gradient(145deg,rgba(52,56,70,.66),rgba(24,27,38,.6));-webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);border:1px solid rgba(255,255,255,.22);box-shadow:0 18px 50px rgba(0,0,0,.5),inset 1.5px 1.5px 2px rgba(255,255,255,.4),inset -1px -1px 2px rgba(255,255,255,.12);font-size:12px;min-width:220px;opacity:0;transform:translateY(8px) scale(.96);translate:var(--ox,26px) var(--oy,26px);transition:opacity .15s,transform .25s cubic-bezier(.34,1.56,.64,1),translate .28s cubic-bezier(.22,1,.36,1)}
#tip.v{opacity:1;transform:none}
#tip h3{margin:0 0 8px;font-size:15px}
#tip div{display:flex;justify-content:space-between;gap:18px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);padding:2px 0}
#tip div b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:9px}
footer{padding:10px 28px 14px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#5e6785}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header>
 <div><div class="eyebrow">⚛ Interaktívna mapa</div><h1>JADROVÁ ENERGIA VO SVETE</h1>
 <div class="sub">plocha = TWh výroba · prejdi kurzorom nad krajinu · klikni pre výber</div></div>
 <div class="stats"><div class="stat"><b id="n1">0</b><span>PWh celkom</span></div><div class="stat"><b id="n2">0</b><span>krajín</span></div><div class="stat"><b id="n3">0</b><span>reaktorov</span></div></div>
</header>
<div class="legend" id="lg"></div>
<main><div id="map"></div></main>
<div id="tip"></div>
<footer>Zdroj: World Nuclear Association · IAEA PRIS · TWh a podiel jadra: dáta 2024 · reaktory: stav 2026</footer>
<script>
const R={"Európa":["#3b82f6","#6d5dfc"],"Ázia":["#f59e0b","#ef4444"],"Amerika":["#10b981","#06b6d4"],"Afrika":["#ec4899","#a855f7"]};
// [kód, názov, región, TWh, reaktory] – hodnoty sú približné, uprav podľa vlastných dát
const D=[["US","USA","Amerika",782,94],["CN","Čína","Ázia",450,65],["FR","Francúzsko","Európa",361,57],["RU","Rusko","Európa",217,37],["KR","Južná Kórea","Ázia",171,26],["CA","Kanada","Amerika",90,19],["JP","Japonsko","Ázia",85,33],["ES","Španielsko","Európa",56,7],["UA","Ukrajina","Európa",55,15],["SE","Švédsko","Európa",49,6],["IN","India","Ázia",48,24],["GB","Veľká Británia","Európa",40,9],["AE","SAE","Ázia",40,4],["FI","Fínsko","Európa",32,5],["BE","Belgicko","Európa",31,5],["CZ","Česko","Európa",30,6],["CH","Švajčiarsko","Európa",23,4],["PK","Pakistan","Ázia",22,6],["SK","Slovensko","Európa",17,5],["BG","Bulharsko","Európa",17,2],["HU","Maďarsko","Európa",16,4],["BR","Brazília","Amerika",14,2],["RO","Rumunsko","Európa",11,2],["MX","Mexiko","Amerika",10,2],["ZA","Juhoafrická rep.","Afrika",10,2],["BY","Bielorusko","Európa",9,2],["AR","Argentína","Amerika",8,3],["IR","Irán","Ázia",6,1],["SI","Slovinsko","Európa",6,1],["NL","Holandsko","Európa",4,1],["AM","Arménsko","Ázia",2.5,1]];
const W={US:[782,18.2],CN:[417.5,4.7],FR:[364.4,67.3],RU:[202.1,17.8],KR:[179.4,31.7],CA:[81.2,13.4],JP:[84.9,8],ES:[52.1,19.9],UA:[49.9,52],SE:[48.7,29.1],IN:[49.9,3.3],GB:[37.3,12.3],AE:[36.5,21.8],FI:[31.1,39.1],BE:[29.7,40.5],CZ:[28,40.2],CH:[23,28.6],PK:[22.8,16.7],SK:[17,60.6],BG:[15.1,41.6],HU:[15.2,47.1],BR:[14.9,2.3],BY:[14.7,36.3],MX:[12,4.8],RO:[10,19.8],AR:[10.4,7.4],ZA:[7.8,3.9],IR:[6.4,1.7],SI:[5.6,35],NL:[3.4,2.8],AM:[2.6,30.8]};D.forEach(d=>{const w=W[d[0]];d[3]=w[0];d[5]=w[1]});D.sort((a,b)=>b[3]-a[3]);
const T=D.reduce((a,d)=>a+d[3],0),RE=D.reduce((a,d)=>a+d[4],0);
const $=s=>document.querySelector(s),map=$("#map"),tip=$("#tip"),fmt=n=>n.toLocaleString("sk-SK",{maximumFractionDigits:1});
function sq(it,x,y,w,h){const o=[];let r=it.slice();while(r.length){const sh=Math.min(w,h);let row=[],best=1/0,sum=0;
 const worst=(t,s)=>{const mx=Math.max(...t.map(i=>i.a)),mn=Math.min(...t.map(i=>i.a));return Math.max(sh*sh*mx/(s*s),s*s/(sh*sh*mn))};
 while(r.length){const t=row.concat(r[0]),s=sum+r[0].a,wr=worst(t,s);if(row.length&&wr>best)break;row=t;sum=s;best=wr;r.shift()}
 if(w>=h){const rw=sum/h;let cy=y;row.forEach(i=>{const ih=i.a/rw;o.push({d:i.d,x,y:cy,w:rw,h:ih});cy+=ih});x+=rw;w-=rw}
 else{const rh=sum/w;let cx=x;row.forEach(i=>{const iw=i.a/rh;o.push({d:i.d,x:cx,y,w:iw,h:rh});cx+=iw});y+=rh;h-=rh}}return o}
let sel=null,flt=null;
function draw(first){const W=map.clientWidth,H=map.clientHeight,k=W*H/T;
 const rects=sq(D.map(d=>({d,a:d[3]*k})),0,0,W,H);map.innerHTML="";
 rects.forEach((r,i)=>{const d=r.d,c=R[d[2]],m=Math.min(r.w,r.h),el=document.createElement("div");
  el.className="tile"+(sel==d[0]?" sel":"")+(flt&&flt!=d[2]?" off":"");
  el.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;--i:${i};--c1:${c[0]};--c2:${c[1]};--s:${Math.min(1.24,Math.max(1.025,1+16/m)).toFixed(2)};--p:${Math.max(280,m*3.5).toFixed(0)}px`;
  if(!first)el.style.animation="none";
  const pad=m<45?3:m<75?6:m<110?9:12,iw=r.w-11-2*pad,ih=r.h-11-2*pad,fs=Math.max(7,Math.min(34,m/4.2,iw/1.45)),fn=Math.min(34,m/4.2,iw/(d[1].length*.62)),full=fn>=15&&m>=64&&ih>=fn*1.2,xl=r.w>170&&r.h>140,rank=D.indexOf(d)+1,sh=d[3]/T*100,fc=full?fn:fs,used=fc*1.15,num=fmt(d[3]),twTxt=iw>=(num.length+4)*6.6?num+" TWh":(iw>=num.length*7.4?num:""),showTW=twTxt&&ih>=used+16,showNm=!full&&!xl&&ih>=used+34&&iw>=d[1].length*6.3,tiny=!showTW&&!showNm&&!xl;
  el.innerHTML=`<div class="in" style="padding:${pad}px;${tiny?"justify-content:center;align-items:center;":""}"><div class="cc" style="font-size:${fc.toFixed(1)}px;line-height:1.1;${fc<15?"letter-spacing:0;":""}">${full?d[1]:d[0]}</div>${xl?`<div class="nm">${d[2]} · #${rank} producent</div><div class="det"><div><b>${fmt(sh)} %</b><span>glob. podiel</span></div><div><b>${d[4]}</b><span>reaktorov</span></div>${r.w>270?`<div><b>${fmt(d[3]/d[4])}</b><span>TWh / reaktor</span></div>`:""}</div>`:(showNm?`<div class="nm">${d[1]}</div>`:"")}${xl?`<div class="tw" style="font-size:${Math.min(30,m/7).toFixed(0)}px">${num} TWh</div>`:(showTW?`<div class="tw f">${twTxt}</div>`:"")}</div>`;
  el.onmouseenter=()=>{map.classList.add("h");tip.innerHTML=`<h3 style="color:${c[0]}">${d[1]}</h3><div>Región<b>${d[2]}</b></div><div>Výroba<b>${fmt(d[3])} TWh</b></div><div>Glob. podiel<b>${fmt(d[3]/T*100)} %</b></div><div>Reaktory<b>${d[4]}</b></div><div>Poradie vo svete<b>#${D.indexOf(d)+1}</b></div><div>Výroba na reaktor<b>${fmt(d[3]/d[4])} TWh</b></div><div>Podiel jadra v krajine<b>${fmt(d[5])} %</b></div><div class="cap">Podiel na svetovej výrobe<b>${fmt(d[3]/T*100)} %</b></div><div class="bar" style="--c1:${c[0]};--c2:${c[1]}"><i style="width:${Math.max(2,d[3]/T*100).toFixed(1)}%"></i></div>`;tip.classList.add("v")};
  el.onmouseleave=()=>{el.style.removeProperty("--rx");el.style.removeProperty("--ry");map.classList.remove("h");tip.classList.remove("v")};
  el.onmousemove=e=>{const b=el.querySelector(".in").getBoundingClientRect();el.style.setProperty("--mx",(e.clientX-b.left)/b.width*100+"%");el.style.setProperty("--my",(e.clientY-b.top)/b.height*100+"%");const px=Math.max(-.5,Math.min(.5,(e.clientX-b.left)/b.width-.5)),py=Math.max(-.5,Math.min(.5,(e.clientY-b.top)/b.height-.5));el.style.setProperty("--rx",(-py*9).toFixed(1)+"deg");el.style.setProperty("--ry",(px*9).toFixed(1)+"deg");
   const tw=tip.offsetWidth,th=tip.offsetHeight,g=26;tip.style.left=e.clientX+"px";tip.style.top=e.clientY+"px";tip.style.setProperty("--ox",e.clientX+g+tw>innerWidth-8?(-tw-g)+"px":g+"px");tip.style.setProperty("--oy",e.clientY+g+th>innerHeight-8?(-th-g)+"px":g+"px")};
  el.onclick=()=>{sel=sel==d[0]?null:d[0];document.querySelectorAll(".tile").forEach((t,j)=>t.classList.toggle("sel",sel==rects[j].d[0]))};
  map.appendChild(el)})}
function count(id,to,dec,ms=1600){const e=$(id),t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/ms),v=to*(1-Math.pow(1-p,4));e.textContent=v.toLocaleString("sk-SK",{minimumFractionDigits:dec,maximumFractionDigits:dec});if(p<1)requestAnimationFrame(f)})(t0)}
$("#lg").innerHTML=Object.keys(R).map(n=>`<button class="chip" data-r="${n}" style="--c1:${R[n][0]}"><i></i>${n}</button>`).join("");
document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{flt=flt==b.dataset.r?null:b.dataset.r;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.r==flt));draw(false)});
draw(true);count("#n1",T/1000,2);count("#n2",D.length,0,1200);count("#n3",RE,0);
document.querySelectorAll(".chip,.stat").forEach(e=>{e.addEventListener("pointermove",ev=>{const b=e.getBoundingClientRect(),x=(ev.clientX-b.left)/b.width-.5,y=(ev.clientY-b.top)/b.height-.5;e.style.setProperty("--rx",(-y*22).toFixed(1)+"deg");e.style.setProperty("--ry",(x*22).toFixed(1)+"deg")});e.addEventListener("pointerleave",()=>{e.style.removeProperty("--rx");e.style.removeProperty("--ry")})});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>draw(false),120)});
</script></body></html>
