function ti(d){const c=R[d[2]];return `<h3 style="color:${c[0]}">${d[1]}</h3><div>Región<b>${d[2]}</b></div><div>Výroba<b>${fmt(d[3])} TWh</b></div><div>Glob. podiel<b>${fmt(d[3]/T*100)} %</b></div><div>Reaktory<b>${d[4]}</b></div><div>Poradie vo svete<b>#${D.indexOf(d)+1}</b></div><div>Výroba na reaktor<b>${fmt(d[3]/d[4])} TWh</b></div><div>Podiel jadra v krajine<b>${fmt(d[5])} %</b></div><div>Elektrárne na mape<b>${PL.filter(q=>q[0]==d[0]).length}</b></div><div class="cap">Podiel na svetovej výrobe<b>${fmt(d[3]/T*100)} %</b></div><div class="bar" style="--c1:${c[0]};--c2:${c[1]}"><i style="width:${Math.max(2,d[3]/T*100).toFixed(1)}%"></i></div>`}
function pi(d){const k=DC[d.cc],c=R[k[2]],s=d.units/k[4]*100;return `<h3 style="color:${c[0]}">${d.name}</h3><div>Krajina<b>${d.c}</b></div><div>Región<b>${k[2]}</b></div><div>Reaktory<b>${d.units}</b></div><div>Výroba krajiny<b>${fmt(k[3])} TWh</b></div>${d.note?`<div>Stav<b>${d.note}</b></div>`:""}<div class="cap">Podiel reaktorov krajiny<b>${fmt(s)} %</b></div><div class="bar" style="--c1:${c[0]};--c2:${c[1]}"><i style="width:${Math.min(100,s).toFixed(1)}%"></i></div>`}
